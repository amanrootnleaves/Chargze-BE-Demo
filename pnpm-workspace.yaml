allowBuilds:
  '@apollo/protobufjs': false
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  aws-sdk: true
  core-js: false
  core-js-pure: false
  esbuild: true
  prisma: false
  protobufjs: true
  sharp: true
  tld-list: false
  unix-dgram: false
overrides:
  graphql: 16.8.0
ignore-workspace-root-check: true
packages:
  # all packages in sub dirs of packages/ and components/
  - 'packages/**'
