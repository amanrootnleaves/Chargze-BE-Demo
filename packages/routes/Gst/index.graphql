#
# GRAPH
#
type Gst {
  id: ID
  createdAt: DateTime
  updatedAt: DateTime
  displayName: String
  description: String
  country: JSON
  state: JSON
  Company: Company
  Account: Account
  message: String
  status: String
  _totalCount: Int
}

#
# RESOLVER
#
extend type Mutation {
  GstCreate(
    accountId: ID,
    displayName: String!
    description: String!,
    state: JSON!,
    country: JSON!
  ): Gst!
  @isAuthenticated(accountType: [COMPANY, VENDOR])
  @rateLimit(window: "1s", max: 20, message: "RATE_LIMIT")
  GstUpdate(
    gstId: ID!
    displayName: String
    description: String,
    state: JSON,
    country: JSON
  ): Gst!
  @isAuthenticated(accountType: [COMPANY, VENDOR])
  @rateLimit(window: "1s", max: 20, message: "RATE_LIMIT")
  GstDelete(gstId: ID!): Gst!
  @isAuthenticated(accountType: [COMPANY, VENDOR])
  @rateLimit(window: "1s", max: 20, message: "RATE_LIMIT")
}
extend type Query {
  GstRead(
    gstId: ID
    ofVendorId: ID
    startDate: DateTime
    endDate: DateTime
    take: PositiveInt
    skip: Int
    displayNameToSearch: String
    sort: JSON
    filter: JSON
  ): [Gst!]!
  @isAuthenticated(accountType: [COMPANY, VENDOR, ADMIN])
  @rateLimit(window: "1s", max: 20, message: "RATE_LIMIT")
}
