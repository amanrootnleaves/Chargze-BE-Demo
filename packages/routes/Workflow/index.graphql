#
# GRAPH
#
type Workflow {
  id: ID
  createdAt: DateTime
  updatedAt: DateTime
  displayName: String
  description: String
  thumbnailStoredAt: Image
  isRequired: Boolean
  edges: JSON
  project: JSON
  feature: JSON
  Project: Project
  Feature: Feature
  Steps: [WorkflowStep!]!
  message: String
  status: String
  _totalCount: Int
}


#
# RESOLVER
#
extend type Mutation {
  WorkflowCreate(
    projectId: JSON!
    featureId: JSON!
    displayName: String!
    description: String!
    thumbnailStoredAt: Image
    isRequired: Boolean
  ): Workflow! @isAuthenticated(accountType: [ADMIN, COMPANY]) @rateLimit(window: "1s", max: 20, message: "RATE_LIMIT")
  WorkflowUpdate(
    workflowId: ID!
    projectId: JSON!
    featureId: JSON!
    displayName: String
    description: String
    thumbnailStoredAt: Image
    edges: JSON
    isRequired: Boolean
  ): Workflow! @isAuthenticated(accountType: [ADMIN, COMPANY]) @rateLimit(window: "1s", max: 20, message: "RATE_LIMIT")
  WorkflowEdges(workflowId: ID!, edges: JSON): Workflow! @isAuthenticated(accountType: [ADMIN, COMPANY]) @rateLimit(window: "1s", max: 20, message: "RATE_LIMIT")
  WorkflowDelete(workflowId: ID!): Workflow! @isAuthenticated(accountType: [ADMIN, COMPANY]) @rateLimit(window: "1s", max: 20, message: "RATE_LIMIT")
  WorkflowUpload(workflowId: ID!, thumbnailStoredAt: Image!): Workflow! @isAuthenticated(accountType: [ADMIN, COMPANY]) @rateLimit(window: "1s", max: 20, message: "RATE_LIMIT")
}
extend type Query {
  WorkflowRead(
    workflowId: ID
    companyId: ID
    displayNameToSearch: String
    filter: JSON
    sort: JSON
    take: PositiveInt
    skip: Int
  ): [Workflow!]!
  @isAuthenticated
  @rateLimit(window: "1s", max: 20, message: "RATE_LIMIT")
}
