type Category {
  id: ID!
  createdAt: DateTime
  updatedAt: DateTime
  name: String
  slug: String
  description: String
  iconStoredAt: JSON
  imageStoredAt: JSON
  isActive: Boolean
  isFeatured: Boolean
  sortOrder: Int
  _totalCount: Int
}

extend type Query {
  CategoryRead(
    categoryId: ID
    search: String
    isActive: Boolean
    take: PositiveInt
    skip: Int
  ): [Category!]!
    @isAuthenticated(accountType: [ADMIN, COMPANY, EMPLOYEE])
    @rateLimit(window: "1s", max: 20, message: "RATE_LIMIT")
}

extend type Mutation {
  CategoryCreate(
    name: String!
    description: String
    isActive: Boolean
    imageStoredAt: JSON
  ): Category!
    @isAuthenticated(accountType: [ADMIN, COMPANY, EMPLOYEE])
    @rateLimit(window: "1s", max: 20, message: "RATE_LIMIT")

  CategoryDelete(ids: [ID!]!): Boolean!
    @isAuthenticated(accountType: [ADMIN, COMPANY, EMPLOYEE])
    @rateLimit(window: "1s", max: 20, message: "RATE_LIMIT")
}
