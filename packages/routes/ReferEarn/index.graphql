type ReferralCampaign {
  id: ID!
  accountId: ID
  bannerUrl: String
  linkType: REFERRAL_LINK_TYPE!
  referralLink: String!
  referrerRewardAmount: Float!
  refereeRewardAmount: Float!
  minFirstChargeAmount: Float!
  expiryDate: String
  customMessage: String
  termsAndConditions: [String!]!
  isShortened: Boolean!
  status: REFERRAL_STATUS!
  isDeleted: Boolean!
  createdAt: String!
  updatedAt: String!
}

input CreateReferralCampaignInput {
  bannerUrl: String
  linkType: REFERRAL_LINK_TYPE!
  referralLink: String
  referrerRewardAmount: Float!
  refereeRewardAmount: Float!
  minFirstChargeAmount: Float!
  expiryDate: String
  customMessage: String
  termsAndConditions: [String!]
  isShortened: Boolean
}

input ReferralSharesFilterInput {
  search: String
  tab: REFERRAL_SHARE_TAB
  status: REFERRAL_STATUS
  dateFilter: DateFilterInput
  page: Int
  limit: Int
}

# --- Response Types ---

type ReferralShareItem {
  id: ID!
  referralLink: String!
  customerId: String
  customerCode: String
  sharedByName: String
  mobile: String
  sharedWithCount: Int!
  sharedChannels: [String!]!
  usedByName: String
  usedOn: String
  usedByCount: Int!
  firstChargeAmount: Float
  firstChargeDate: String
  totalClicks: Int!
  commissionAmount: Float!
  status: REFERRAL_STATUS!
  signupStatus: String
  commissionStatus: COMMISSION_STATUS
  earningDate: String
  payoutDate: String
  createdAt: String!
  updatedAt: String!
}

type ReferralSharesResponse {
  nodes: [ReferralShareItem!]!
  totalCount: Int!
  totalPages: Int!
  currentPage: Int!
}

# --- Pagination & Filter Inputs ---

input SectionPaginationInput {
  page: Int
  limit: Int
}

input ReferralDetailsFilterInput {
  referralShareId: ID!
  clicksPagination: SectionPaginationInput
  signupsPagination: SectionPaginationInput
  conversionsPagination: SectionPaginationInput
  activityLogsPagination: SectionPaginationInput
}

# --- Section 1: Referrer Information ---

type ReferrerInformation {
  customerId: ID!
  customerCode: String
  customerName: String!
  mobile: String
  email: String
  joinedOn: String!
  totalReferrals: Int!
  totalLinkClicks: Int!
  totalSignups: Int!
  totalCommissionEarned: Float!
  referralStatus: String!
  isRfidLinked: Boolean!
}

# --- Section 2: Shared Link Details & Share Performance ---

type ShareChannelPerformance {
  channel: String!
  shares: Int!
  percentage: Float!
}

type SharedLinkDetails {
  referralLink: String!
  shareViaChannels: [String!]!
  totalShares: Int!
  lastSharedOn: String
  sharePerformance: [ShareChannelPerformance!]!
}

# --- Section 3: Link Clicks ---

type ReferralClickNode {
  id: ID!
  clickedOn: String!
  deviceInfo: String
  location: String
  channel: String
  source: String
  ipAddress: String
}

type ReferralClicksSection {
  totalClicks: Int!
  signupLinkCount: Int!
  usedByCount: Int!
  nodes: [ReferralClickNode!]!
  totalCount: Int!
  totalPages: Int!
  currentPage: Int!
}

# --- Section 4: Signed Up Users ---

type SignedUpUserNode {
  id: ID!
  usedByName: String!
  mobile: String
  email: String
  signupDate: String!
  signupStatus: String!
}

type SignedUpUsersSection {
  totalSignups: Int!
  pendingVerification: Int!
  verifiedUsers: Int!
  signupConversionRate: Float!
  nodes: [SignedUpUserNode!]!
  totalCount: Int!
  totalPages: Int!
  currentPage: Int!
}

# --- Section 5: Converted Users (Completed First Charge) ---

type ConvertedUserNode {
  id: ID!
  usedByName: String!
  mobile: String
  firstChargeDate: String
  amountSpent: Float!
  discountGiven: Float!
  status: String!
}

type ConvertedUsersSection {
  totalConversions: Int!
  totalRevenueGenerated: Float!
  avgTransactionValue: Float!
  nodes: [ConvertedUserNode!]!
  totalCount: Int!
  totalPages: Int!
  currentPage: Int!
}

# --- Section 6: Commission Details ---

type CommissionDetailsSection {
  totalCommission: Float!
  paidCommission: Float!
  pendingCommission: Float!
  cancelledCommission: Float!
  commissionPerReferral: Float!
  commissionPerConversion: Float!
  lastCommissionDate: String
  nextPayoutDate: String
  payoutStatus: String!
}

# --- Section 7: Program Information ---

type ProgramInformationSection {
  campaignId: ID!
  programName: String!
  programStartDate: String!
  programEndDate: String
  programStatus: REFERRAL_STATUS!
  termsAndConditions: [String!]!
  lastUpdated: String!
  updatedBy: String
}

# --- Section 8: Activity Log ---

type ReferralActivityLogNode {
  id: ID!
  eventType: String!
  title: String!
  description: String
  timestamp: String!
}

type ReferralActivityLogSection {
  nodes: [ReferralActivityLogNode!]!
  totalCount: Int!
  totalPages: Int!
  currentPage: Int!
}

# --- Master Response ---

type ReferralDetailsResponse {
  id: ID!
  referrerInfo: ReferrerInformation!
  sharedLinkDetails: SharedLinkDetails!
  linkClicks: ReferralClicksSection!
  signedUpUsers: SignedUpUsersSection!
  convertedUsers: ConvertedUsersSection!
  commissionDetails: CommissionDetailsSection!
  programInformation: ProgramInformationSection!
  activityLogs: ReferralActivityLogSection!
}

extend type Query {
  getReferralShares(filter: ReferralSharesFilterInput): ReferralSharesResponse!
    @isAuthenticated(accountType: [COMPANY, EMPLOYEE, ADMIN])
    @rateLimit(window: "1s", max: 20, message: "RATE_LIMIT")
  getReferralDetails(
    filter: ReferralDetailsFilterInput!
  ): ReferralDetailsResponse!
    @isAuthenticated(accountType: [COMPANY, EMPLOYEE, ADMIN])
    @rateLimit(window: "1s", max: 20, message: "RATE_LIMIT")
}

extend type Mutation {
  createReferralCampaign(
    input: CreateReferralCampaignInput!
  ): ReferralCampaign!
    @isAuthenticated(accountType: [COMPANY, EMPLOYEE, ADMIN])
    @rateLimit(window: "1s", max: 20, message: "RATE_LIMIT")
}
